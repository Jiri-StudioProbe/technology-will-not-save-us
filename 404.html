<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404: Technology will not save us</title>
<style>
/* Self-contained on purpose: this page can be served from any path. */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#008080;color:#000;font:22px/1.3 "Courier New",monospace}
.win{width:min(92vw,32rem);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 2px 0 #000;padding:3px}
.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:.15rem .5rem}
.body{padding:1.2rem 1.1rem}
.row{display:flex;gap:1rem;align-items:center}
.ico{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:#e5251b;color:#fff;display:grid;place-items:center;font:700 1.7rem/1 Arial,sans-serif}
a.btn{display:block;width:fit-content;margin:1.3rem auto 0;background:#c0c0c0;color:#000;text-decoration:none;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:.25rem 1.2rem}
a.btn:focus-visible{outline:1px dotted #000;outline-offset:-6px}
p{margin:0}
</style>
</head>
<body>
<main class="win" role="alert">
  <div class="title">404.exe</div>
  <div class="body">
    <div class="row"><div class="ico" aria-hidden="true">x</div>
    <p>The exhibition has stopped responding.<br>This room does not exist, or it did and has since been updated.</p></div>
    <a class="btn" id="home" href="/">Restart exhibition</a>
  </div>
</main>
<script>
/* On a GitHub Pages project site the exhibition lives under /repo-name/, on a custom domain at the root. */
(function(){var p=location.pathname.split('/')[1];
if(/\.github\.io$/.test(location.hostname)&&p)document.getElementById('home').href='/'+p+'/';
else document.getElementById('home').href='/';})();
</script>
</body>
</html>
